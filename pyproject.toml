[project]
name = "wp-bootstrap-mcp"
version = "0.1.0"
description = "MCP server that clones wordpress-docker-tailscale and writes a site .env"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
wp-bootstrap-mcp = "wp_bootstrap_mcp.server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
